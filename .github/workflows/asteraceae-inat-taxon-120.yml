name: Independently check held iNaturalist taxon cover photos (private only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/archive_asteraceae_held_inat_taxon.py'
      - '.github/workflows/asteraceae-inat-taxon-120.yml'
permissions:
  contents: write
concurrency:
  group: asteraceae-held-inat-taxon-import
  cancel-in-progress: false
jobs:
  exact-photo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, path: shell, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: staging/asteraceae-metadata, path: staging, persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Pin canonical source SHA, retrieve image blobs only when needed
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(python3 -c 'import json;print(json.load(open("staging/data/collection-index.json"))["source_commit_sha"])')"
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/Crking92/Hays-County-Botany.git "$RUNNER_TEMP/hays-inat-originals"
          git -C "$RUNNER_TEMP/hays-inat-originals" fetch --depth 1 origin "$SHA"
          git -C "$RUNNER_TEMP/hays-inat-originals" update-ref refs/heads/source-pinned "$SHA"
          git -C "$RUNNER_TEMP/hays-inat-originals" symbolic-ref HEAD refs/heads/source-pinned
      - name: Check exact iNat default photo license, artist, and visual identity
        run: python3 shell/scripts/archive_asteraceae_held_inat_taxon.py staging "$RUNNER_TEMP/hays-inat-originals"
      - name: Preserve only verified source image originals in private branch
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Asteraceae migration/asteraceae-upstream-inat-taxon-120-ledger.json migration/asteraceae-upstream-inat-taxon-120-summary.json
          git diff --cached --check -- 'migration/*.json'
          if ! git diff --cached --quiet; then
            git commit -m "Stage current-license-verified iNaturalist taxon photos for private learner"
            git fetch origin staging/asteraceae-metadata
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/staging/asteraceae-metadata
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteraceae-inat-taxon-19-photo-source-review
          path: staging/qa-report/asteraceae-inat-taxon-rights/
          retention-days: 30
          if-no-files-found: warn
