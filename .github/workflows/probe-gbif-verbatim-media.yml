name: Inspect source photo terms in GBIF verbatim media (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_gbif_verbatim_photo_metadata.py'
      - '.github/workflows/probe-gbif-verbatim-media.yml'
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 scripts/probe_gbif_verbatim_photo_metadata.py
