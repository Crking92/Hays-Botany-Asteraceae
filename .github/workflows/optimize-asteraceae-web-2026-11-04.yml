name: Safely optimize Asteraceae public gallery display copies
on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize_public_gallery_display.py'
      - '.github/workflows/optimize-asteraceae-web-2026-11-04.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  pages: write
concurrency:
  group: asteraceae-web-display-once
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install JPEG optimization dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Pin originals before changing any website bytes
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_BRANCH=archive/asteraceae-pre-web-optimization-2026-11-04
          git fetch origin main
          git checkout -B web-display-optimize origin/main
          git fetch origin refs/heads/$ARCHIVE_BRANCH:refs/remotes/origin/$ARCHIVE_BRANCH
          git merge-base --is-ancestor origin/$ARCHIVE_BRANCH HEAD
          git push origin HEAD:refs/heads/$ARCHIVE_BRANCH
          echo "ARCHIVE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "ARCHIVE_BRANCH=$ARCHIVE_BRANCH" >> "$GITHUB_ENV"
      - name: Optimize JPEG display copies and validate gallery
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_automatic_gallery.py --site-root site
          python3 scripts/optimize_public_gallery_display.py --archive-sha "$ARCHIVE_SHA" --archive-branch "$ARCHIVE_BRANCH" --site-root site
          python3 scripts/verify_automatic_gallery.py --site-root site
          python3 - <<'PY'
          from pathlib import Path
          size=sum(p.stat().st_size for p in Path("site").rglob("*") if p.is_file())
          assert size <= 700_000_000, ("Site directory exceeds 700 MB",size)
          print("ASTERACEAE_SITE_BYTES_AFTER",size,flush=True)
          PY
      - name: Publish smaller website copies without touching archived originals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/media site/data/species site/data/web-display-optimization.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No optimizations necessary."
            exit 0
          fi
          git commit -m "Optimize Asteraceae website JPEGs; retain original provenance in pinned archive"
          git fetch origin main
          git rebase origin/main
          python3 scripts/verify_automatic_gallery.py --site-root site
          git push origin HEAD:main
      - name: Request Pages deployment and full public-gallery image verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null
          python3 - <<'PY'
          import hashlib,json,pathlib,time,urllib.request
          root=pathlib.Path("site")
          report=json.loads((root/"data/web-display-optimization.json").read_text())
          sample=report["changes"][0]["src"]
          expected=hashlib.sha256((root/sample).read_bytes()).hexdigest()
          url="https://crking92.github.io/Hays-Botany-Asteraceae/site/"+sample
          for attempt in range(65):
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"HaysBotanyDisplayOptimizerQA"})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      if hashlib.sha256(response.read()).hexdigest()==expected:
                          print("ASTERACEAE_NEW_DISPLAY_PAGES_READY",sample,flush=True)
                          break
              except Exception as ex:
                  print("Pages pending",str(ex),flush=True)
              time.sleep(12)
          else:
              raise RuntimeError("Optimized public Pages photo has not deployed")
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/smoke-public-asteraceae-gallery.yml/dispatches" -f ref=main >/dev/null
          echo "Triggered complete byte-for-byte live image verification."

# Trigger initial safe website display optimization run.
