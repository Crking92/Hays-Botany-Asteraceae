name: Probe remaining Asteraceae license sources (read only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_remaining_asteraceae_photo_sources.py'
      - '.github/workflows/probe-remaining-photo-sources.yml'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 scripts/probe_remaining_asteraceae_photo_sources.py
