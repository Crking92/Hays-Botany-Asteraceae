name: Verify three accepted Asteraceae synonym photo identities and source rights (PRIVATE)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/recover_asteraceae_homotypic_synonym_photos.py'
      - '.github/workflows/asteraceae-final-synonym-photos.yml'
permissions:
  contents: write
concurrency:
  group: asteraceae-three-photo-synonym-backfill
  cancel-in-progress: false
jobs:
  check-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, path: shell, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: staging/asteraceae-metadata, path: staging, persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Retrieve pinned original-source photo bytes without checking out unrelated images
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(python3 -c 'import json;print(json.load(open("staging/data/collection-index.json"))["source_commit_sha"])')"
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/Crking92/Hays-County-Botany.git "$RUNNER_TEMP/hays-old-plain-source"
          git -C "$RUNNER_TEMP/hays-old-plain-source" fetch --depth 1 origin "$SHA"
          git -C "$RUNNER_TEMP/hays-old-plain-source" update-ref refs/heads/photo-source "$SHA"
          git -C "$RUNNER_TEMP/hays-old-plain-source" symbolic-ref HEAD refs/heads/photo-source
      - name: Check exact iNat photos under documented taxonomic synonyms
        run: python3 shell/scripts/recover_asteraceae_homotypic_synonym_photos.py staging "$RUNNER_TEMP/hays-old-plain-source"
      - name: Save verified licensed photos and exact source-provenance ledgers to private staging
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add external-media/asteraceae/synonym-inat content/taxa/Asteraceae/Hymenopappus migration/asteraceae-last-four-original-photo-rights-ledger.json migration/asteraceae-last-four-new-synonym-cc-ledger.json migration/asteraceae-last-four-taxonomic-photo-decisions.json migration/asteraceae-last-four-taxonomic-photo-summary.json
          git diff --cached --check -- migration/
          if ! git diff --cached --quiet; then
            git commit -m "Recover Kew-matched Asteraceae synonym photographs, restore verified old-plainsman original"
            git fetch origin staging/asteraceae-metadata
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/staging/asteraceae-metadata
          fi
