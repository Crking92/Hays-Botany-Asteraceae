name: Asteraceae shared design desktop-mobile visual QA (no deploy)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test_collection_preview_browser.py'
      - '.github/workflows/asteraceae-ui-browser-qa.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install headless browser
        run: |
          python -m pip install 'playwright>=1.53,<2'
          python -m playwright install --with-deps chromium
      - name: Build nonpublished UI and run desktop/mobile tests
        run: |
          python scripts/build_collection_preview.py
          python -m http.server 8767 --directory dist >/tmp/collection-preview-server.log 2>&1 &
          sleep 2
          python scripts/test_collection_preview_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asteraceae-website-layout-desktop-and-mobile
          path: qa-report/website-prototype/
          retention-days: 30
          if-no-files-found: warn
