name: Backfill photo-empty Asteraceae with NEW Texas research-grade CC photographs (PRIVATE)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill_asteraceae_texas_research_cc.py'
      - '.github/workflows/asteraceae-new-texas-cc-backfill.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: asteraceae-texas-new-cc-photo-backfill
  cancel-in-progress: false
jobs:
  import-new-source-photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, path: shell, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: staging/asteraceae-metadata, path: staging, persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install photo validation and EXIF-stripping software
        run: python -m pip install 'Pillow>=10,<12'
      - name: Check Texas research-grade taxon ID and each individual photo CC license, then archive
        run: python3 shell/scripts/backfill_asteraceae_texas_research_cc.py staging
      - name: Commit validated new licensed media and records to PRIVATE staging only
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add external-media/asteraceae/texas-inat migration/asteraceae-new-texas-inat-cc-photo-ledger.json migration/asteraceae-new-texas-inat-cc-decisions.json migration/asteraceae-new-texas-inat-cc-summary.json
          git diff --cached --check -- 'migration/*.json'
          if ! git diff --cached --quiet; then
            git commit -m "Backfill Asteraceae photo gaps with credited Texas CC research-grade observations"
            git fetch origin staging/asteraceae-metadata
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/staging/asteraceae-metadata
          fi
      - name: Save rights and species coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteraceae-new-texas-research-cc-photo-gap-report
          path: staging/qa-report/asteraceae-new-texas-photo-backfill/
          retention-days: 30
          if-no-files-found: warn
