name: Probe current iNaturalist exact-photo license source
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_inat_nc_exact_photo_pages.py'
      - '.github/workflows/probe-inat-nc-photo-pages.yml'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 scripts/probe_inat_nc_exact_photo_pages.py
