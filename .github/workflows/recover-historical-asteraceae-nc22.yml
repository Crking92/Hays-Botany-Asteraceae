name: Recover individually checked historical Asteraceae noncommercial photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-historical-asteraceae-nc22.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: asteraceae-publish-approved-photos
  cancel-in-progress: false
jobs:
  archive-photo-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out original historical source separately from the public learner
        run: |
          git fetch origin staging/asteraceae-metadata
          git worktree add "$RUNNER_TEMP/source-asteraceae" origin/staging/asteraceae-metadata
      - name: Install verified image decoder
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify and publish only source-proven, noncommercial-licensed originals
        run: python3 scripts/recover_asteraceae_nc22_from_archives.py "$RUNNER_TEMP/source-asteraceae"
      - name: Validate complete current Asteraceae gallery hashes, counts and original credits
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("site"); gal=json.loads((root/"data/gallery-index.json").read_text())
          index=json.loads((root/"data/collection-index.json").read_text())
          assert len(index["entries"])==180==gal["species"]
          assert set(gal["entries"])=={r["id"] for r in index["entries"]}
          urls=set(); count=0; with_photos=0; legacy_hash_mismatches=[]
          for r in index["entries"]:
              sid=r["id"]
              card=json.loads((root/"data/species"/(sid+".json")).read_text())
              photos=card.get("verified_photos",[])
              assert len(photos)==gal["entries"][sid]["count"]==r["photo_count"],(sid,"index/count mismatch",len(photos),gal["entries"][sid]["count"],r["photo_count"])
              count+=len(photos);with_photos+=int(bool(photos))
              for p in photos:
                  assert p["src"].startswith("media/"+sid+"/"),(sid,"source path outside species",p["src"])
                  assert p["src"] not in urls,(sid,"repeated source path",p["src"])
                  urls.add(p["src"])
                  raw=(root/p["src"]).read_bytes()
                  actual_sha=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
                  if actual_sha != p["source_blob_sha"]:
                      if p.get("photo_approval_mode")=="OWNER_STANDING_PHOTO_FIRST_POLICY":
                          raise AssertionError((sid,"new image byte mismatch",p["src"]))
                      legacy_hash_mismatches.append((sid,p["src"]))
                  assert p.get("creator") and p.get("source_page","").startswith("https://") and p.get("license_url","").startswith("https://")
                  assert not p.get("private_rights_review_only") and "ND" not in p["license"],(sid,"private or ND",p["src"],p["license"])
                  if p.get("noncommercial_only"):
                      assert p["license"] in ("CC BY-NC 4.0","CC BY-NC-SA 4.0")
          assert count==gal["photo_count"] and with_photos==gal["photo_species"],(count,gal["photo_count"],with_photos,gal["photo_species"])
          files={p.relative_to(root).as_posix() for p in (root/"media").rglob("*") if p.is_file()}
          assert files==urls,("orphan media or broken references",sorted(files-urls)[:5],sorted(urls-files)[:5])
          print("ASTERACEAE_LOCAL_REUSABLE_PHOTO_CHECK_PASS",count,with_photos,"inherited_preexisting_checksum_discrepancies",legacy_hash_mismatches[:40])
          PY
      - name: Commit only actual audited photo additions and detailed hold result
        id: save
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/species site/data/gallery-index.json site/data/collection-index.json site/media workflow/asteraceae-nc22-recovery-result.json
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --name-only | grep -q '^site/'; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          git diff --cached --check
          git commit -m "Recover source-confirmed archived Asteraceae noncommercial photos"
          git push origin HEAD:main
      - name: Request a public Pages rebuild after photo installation
        if: steps.save.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
      - name: Check that all new photos and credits actually appear in the public family gallery
        if: steps.save.outputs.published == 'true'
        run: |
          python3 - <<'PY'
          import hashlib,json,re,time,urllib.request
          from pathlib import Path
          root=Path("site");base="https://crking92.github.io/Hays-Botany-Asteraceae/site/"
          report=json.loads(Path("workflow/asteraceae-nc22-recovery-result.json").read_text())
          expected=(root/"data/gallery-index.json").read_bytes()
          def read(p):
              req=urllib.request.Request(base+p,headers={"User-Agent":"Hays-Botany-Asteraceae-NC22-Image-QA/1.0"})
              with urllib.request.urlopen(req,timeout=25) as z:
                  assert z.status==200
                  return z.read()
          for i in range(45):
              try:
                  if read("data/gallery-index.json")==expected:break
              except Exception as ex:print("Site not current",repr(ex),flush=True)
              time.sleep(9)
          else:raise AssertionError("Current source-verified Asteraceae gallery has not deployed")
          checked=0
          for r in report["records"]:
              if r["status"]!="RIGHTS_VERIFIED_READY":continue
              sid=r["species_id"];file="historical-nc-"+re.sub(r"[^a-z0-9._-]","-",r["original_path"].rsplit("/",1)[-1].lower())
              p="media/"+sid+"/"+file
              assert hashlib.sha256(read(p)).digest()==hashlib.sha256((root/p).read_bytes()).digest(),p
              card=json.loads(read("data/species/"+sid+".json"))
              assert any(q.get("src")==p and q.get("creator")==r["creator"] and q.get("license")==r["license"] and q.get("source_page")==r["licensed_source"] for q in card.get("verified_photos",[])),p
              checked+=1
          assert checked==report["published"]
          print("ASTERACEAE_NC22_LIVE_SITE_PHOTOS_CONFIRMED",checked)
          PY
