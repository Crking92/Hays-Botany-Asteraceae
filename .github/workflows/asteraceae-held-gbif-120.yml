name: Verify priority GBIF photo-level CC and archived image identity (PRIVATE)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/archive_asteraceae_held_gbif.py'
      - '.github/workflows/asteraceae-held-gbif-120.yml'
permissions:
  contents: write
concurrency:
  group: asteraceae-priority-gbif-photo-recheck
  cancel-in-progress: false
jobs:
  check-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, path: shell, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: staging/asteraceae-metadata, path: staging, persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Pin original botanical data source commit
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(python3 -c 'import json;print(json.load(open("staging/data/collection-index.json"))["source_commit_sha"])')"
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/Crking92/Hays-County-Botany.git "$RUNNER_TEMP/hays-gbif-originals"
          git -C "$RUNNER_TEMP/hays-gbif-originals" fetch --depth 1 origin "$SHA"
          git -C "$RUNNER_TEMP/hays-gbif-originals" update-ref refs/heads/source-pinned "$SHA"
          git -C "$RUNNER_TEMP/hays-gbif-originals" symbolic-ref HEAD refs/heads/source-pinned
      - name: Check 58 GBIF multimedia records' actual licenses, credited authors and exact image content
        run: python3 shell/scripts/archive_asteraceae_held_gbif.py staging "$RUNNER_TEMP/hays-gbif-originals"
      - name: Commit only verified original image bytes into PRIVATE staging branch
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Asteraceae migration/asteraceae-upstream-gbif-120-ledger.json migration/asteraceae-upstream-gbif-120-summary.json migration/asteraceae-upstream-gbif-120-all-decisions.json
          git diff --cached --check -- 'migration/*.json'
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified Asteraceae GBIF multimedia originals in private staging only"
            git fetch origin staging/asteraceae-metadata
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/staging/asteraceae-metadata
          fi
      - name: Save nonpublishing per-media source verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteraceae-gbif-58-multimedia-license-audit
          path: staging/qa-report/asteraceae-gbif-media-rights/
          retention-days: 30
          if-no-files-found: warn
