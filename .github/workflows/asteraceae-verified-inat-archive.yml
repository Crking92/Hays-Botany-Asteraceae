name: Verify iNaturalist photo-level licenses and archive to private staging only
on:
  push:
    branches: [main]
    paths:
      - 'scripts/archive_verified_asteraceae_inat.py'
      - '.github/workflows/asteraceae-verified-inat-archive.yml'
permissions:
  contents: write
concurrency:
  group: asteraceae-inat-private-photo-archive
  cancel-in-progress: false
jobs:
  exact-photo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, path: shell, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: staging/asteraceae-metadata, path: staging, persist-credentials: true}
      - name: Pin original authoritative source without downloading all source photos
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(python3 -c 'import json;print(json.load(open("staging/migration/asteraceae-source-census.json"))["source_commit_sha"])')"
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/Crking92/Hays-County-Botany.git "$RUNNER_TEMP/hays-pinned-inat-source"
          git -C "$RUNNER_TEMP/hays-pinned-inat-source" fetch --depth 1 origin "$SHA"
          git -C "$RUNNER_TEMP/hays-pinned-inat-source" update-ref refs/heads/asteraceae-pinned "$SHA"
          git -C "$RUNNER_TEMP/hays-pinned-inat-source" symbolic-ref HEAD refs/heads/asteraceae-pinned
      - name: Verify exact iNaturalist observation, photo, license and author
        run: python3 shell/scripts/archive_verified_asteraceae_inat.py staging "$RUNNER_TEMP/hays-pinned-inat-source"
      - name: Commit independently verified image originals on private staging, not main
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Asteraceae migration/asteraceae-verified-inat-photo-ledger.json migration/asteraceae-inat-photo-archive-summary.json
          git diff --cached --check -- 'migration/*.json'
          if ! git diff --cached --quiet; then
            git commit -m "Archive source-verified iNaturalist CC/NC photos for noncommercial private staging (not public approved)"
            git push origin HEAD:refs/heads/staging/asteraceae-metadata
          fi
      - name: Preserve per-photo rights results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteraceae-inat-exact-photo-license-review
          path: staging/qa-report/inat-photo-archive/
          retention-days: 30
          if-no-files-found: warn
